<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Timeline - NOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
        .header-meta { font-size: 13px; color: var(--text-muted); }
        
        .header-actions { display: flex; gap: 10px; }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            text-decoration: none;
        }
        .btn-primary { background: var(--accent-primary); color: var(--text-inverse, white); }
        .btn-primary:hover { background: var(--accent-secondary); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--border-hover); }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent-primary), var(--border-color));
        }

        .phase {
            position: relative;
            margin-bottom: 24px;
        }

        .phase-marker {
            position: absolute;
            left: -40px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .phase.succeeded .phase-marker { border-color: var(--success); color: var(--success); }
        .phase.failed .phase-marker { border-color: var(--error); color: var(--error); }
        .phase.running .phase-marker { border-color: var(--warning); color: var(--warning); animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .phase-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .phase.has-errors .phase-content { border-left: 3px solid var(--error); }
        .phase.has-warnings .phase-content { border-left: 3px solid var(--warning); }

        .phase-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .phase-header:hover { background: var(--bg-tertiary); }

        .phase-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .phase-name { font-weight: 600; font-size: 14px; }
        .phase-duration { font-size: 12px; color: var(--text-muted); }

        .phase-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
        }

        .stat { display: flex; align-items: center; gap: 4px; }
        .stat.errors { color: var(--error); }
        .stat.warnings { color: var(--warning); }
        .stat.logs { color: var(--accent-primary); }

        .phase-chevron {
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .phase.expanded .phase-chevron { transform: rotate(180deg); }

        .phase-body {
            display: none;
            border-top: 1px solid var(--border-color);
            padding: 16px;
            background: var(--bg-primary);
        }

        .phase.expanded .phase-body { display: block; }

        /* Log Entry */
        .log-entry {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .log-entry.error { border-left: 3px solid var(--error); }
        .log-entry.warn { border-left: 3px solid var(--warning); }

        .log-header {
            padding: 10px 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
        }

        .log-header:hover { background: var(--bg-tertiary); }

        .log-severity {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .log-severity.error { background: var(--error-bg); color: var(--error); }
        .log-severity.warn { background: var(--warning-bg); color: var(--warning); }

        /* Priority badges */
        .priority-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .priority-badge.p0 { background: var(--error-bg); color: var(--error); }
        .priority-badge.p1 { background: var(--warning-bg); color: var(--warning); }
        .priority-badge.p2 { background: var(--info-bg); color: var(--info); }
        .priority-badge.p3 { background: var(--bg-tertiary); color: var(--text-muted); }

        .log-info { flex: 1; min-width: 0; }
        .log-message {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            word-break: break-word;
        }

        .log-meta {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .log-details {
            display: none;
            padding: 12px 14px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .log-entry.expanded .log-details { display: block; }

        .stack-trace {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: var(--text-muted);
            max-height: 300px;
            overflow-y: auto;
        }

        .stack-trace .hl { color: var(--error); }

        /* Empty State */
        .empty-logs {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* View Log Link */
        .view-log-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--accent-primary);
            text-decoration: none;
            margin-top: 8px;
        }

        .view-log-link:hover { text-decoration: underline; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 8px;
            display: none;
            z-index: 100;
            font-size: 13px;
        }

        .toast.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 id="pageTitle">Test Timeline</h1>
                <div class="header-meta" id="testMeta"></div>
            </div>
            <div class="header-actions">
                <a href="#" id="jitaLink" target="_blank" class="btn btn-primary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    View in JITA
                </a>
                <a href="#" id="backLink" class="btn btn-secondary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back
                </a>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs" style="display: flex; gap: 8px; margin-bottom: 24px;">
            <button class="tab-btn active" data-tab="phases" onclick="switchView('phases')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/>
                </svg>
                Phases
            </button>
            <button class="tab-btn" data-tab="operations" onclick="switchView('operations')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                </svg>
                Operations (<span id="opsCount">0</span>)
            </button>
        </div>

        <style>
            .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
            .tab-btn {
                padding: 10px 18px;
                border-radius: 8px;
                border: 1px solid var(--border-color);
                background: var(--bg-secondary);
                color: var(--text-secondary);
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: all 0.15s;
            }
            .tab-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
            .tab-btn.active { background: var(--accent-primary, #6366f1); color: white; border-color: var(--accent-primary, #6366f1); }
            
            .ops-list { display: flex; flex-direction: column; gap: 12px; }
            .op-card {
                background: var(--bg-secondary);
                border: 1px solid var(--border-color);
                border-radius: 10px;
                overflow: hidden;
            }
            .op-card.has-failure { border-left: 3px solid var(--error); }
            .op-card.has-warnings { border-left: 3px solid var(--warning); }
            .op-header {
                padding: 14px 18px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                cursor: pointer;
                transition: background 0.15s;
            }
            .op-header:hover { background: var(--bg-tertiary); }
            .op-number {
                width: 28px;
                height: 28px;
                background: var(--bg-tertiary);
                border-radius: 6px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11px;
                font-weight: 600;
                color: var(--text-muted);
                margin-right: 12px;
            }
            .op-card.has-failure .op-number { background: var(--error-bg); color: var(--error); }
            .op-title { display: flex; align-items: center; flex: 1; }
            .op-name { font-weight: 600; font-size: 14px; }
            .op-id { font-size: 11px; color: var(--text-muted); margin-left: 12px; font-family: 'JetBrains Mono', monospace; }
            .op-stats { display: flex; gap: 16px; font-size: 12px; }
            .op-stat { display: flex; align-items: center; gap: 4px; }
            .op-stat.errors { color: var(--error); }
            .op-stat.warnings { color: var(--warning); }
            .op-stat.fatal { color: var(--error); font-weight: 600; }
            .op-chevron { color: var(--text-muted); transition: transform 0.2s; }
            .op-card.expanded .op-chevron { transform: rotate(180deg); }
            .op-body {
                display: none;
                border-top: 1px solid var(--border-color);
                padding: 16px;
                background: var(--bg-primary);
            }
            .op-card.expanded .op-body { display: block; }
            .op-error-list { display: flex; flex-direction: column; gap: 8px; }
            .op-error {
                padding: 10px 14px;
                background: var(--bg-secondary);
                border: 1px solid var(--border-color);
                border-radius: 6px;
                font-size: 12px;
            }
            .op-error.fatal { border-left: 3px solid var(--error); }
            .op-error.error { border-left: 3px solid var(--error); }
            .op-error.warn { border-left: 3px solid var(--warning); }
            .op-error-type { font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
            .op-error-msg { color: var(--text-muted); word-break: break-word; }
            .ops-summary {
                background: var(--bg-secondary);
                border: 1px solid var(--border-color);
                border-radius: 10px;
                padding: 16px 20px;
                margin-bottom: 20px;
                display: flex;
                gap: 24px;
            }
            .summary-stat { text-align: center; }
            .summary-stat .value { font-size: 24px; font-weight: 700; }
            .summary-stat .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
            .summary-stat.errors .value { color: var(--error); }
            .summary-stat.warnings .value { color: var(--warning); }
            .summary-stat.failed .value { color: var(--error); }
        </style>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading timeline...</div>
        </div>

        <div id="phasesView" class="timeline" style="display: none;"></div>
        <div id="operationsView" style="display: none;"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // Theme initialization - read from URL or parent/localStorage
        (function initTheme() {
            const params = new URLSearchParams(window.location.search);
            let theme = params.get('theme');
            if (!theme) {
                try { theme = window.parent?.document?.documentElement?.getAttribute('data-theme'); } catch(e) {}
            }
            if (!theme) {
                theme = localStorage.getItem('nova-theme') || 'dark';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
        
        const API = `http://${window.location.hostname}:9360/api/jita`;
        const params = new URLSearchParams(window.location.search);
        const runId = params.get('run');
        const testId = params.get('test');

        let cachedPhases = null;
        let cachedOperations = null;
        let cachedTestInfo = null;
        let currentView = 'phases';

        document.addEventListener('DOMContentLoaded', () => {
            if (!runId) {
                document.body.innerHTML = '<div style="padding: 40px; text-align: center;">Missing run ID</div>';
                return;
            }
            document.getElementById('backLink').href = `jita-browser.html?run=${runId}`;
            loadTimeline();
        });

        async function loadTimeline() {
            try {
                // Load phases
                let url = `${API}/runs/${runId}/timeline`;
                if (testId) url += `?test_result_id=${testId}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.status !== 'success') {
                    throw new Error(data.error || 'Failed to load timeline');
                }
                cachedPhases = data;

                // Load operations
                let opsUrl = `${API}/runs/${runId}/operations`;
                if (testId) opsUrl += `?test_result_id=${testId}`;
                const opsRes = await fetch(opsUrl);
                const opsData = await opsRes.json();
                if (opsData.status === 'success') {
                    cachedOperations = opsData;
                    document.getElementById('opsCount').textContent = opsData.operation_count || 0;
                }

                // Get test info
                const summaryRes = await fetch(`${API}/runs/${runId}/summary`);
                const summaryData = await summaryRes.json();
                if (testId && summaryData.tests) {
                    cachedTestInfo = summaryData.tests.find(t => t.test_result_id === testId);
                }

                displayTimeline(cachedPhases, cachedTestInfo);

            } catch (e) {
                console.error(e);
                showToast('Error: ' + e.message);
            }
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === view);
            });
            
            document.getElementById('phasesView').style.display = view === 'phases' ? 'block' : 'none';
            document.getElementById('operationsView').style.display = view === 'operations' ? 'block' : 'none';
            
            if (view === 'operations' && cachedOperations) {
                displayOperations(cachedOperations);
            }
        }

        function displayTimeline(data, testInfo) {
            document.getElementById('loading').style.display = 'none';
            
            // Update header
            if (testInfo) {
                const shortName = testInfo.test_name.split('.').slice(-2).join('.');
                document.getElementById('pageTitle').textContent = shortName;
                document.getElementById('testMeta').textContent = 
                    `${testInfo.status} • ${formatDuration(testInfo.duration_seconds)} • Run: ${runId.slice(0,8)}...`;
                
                if (testInfo.log_url) {
                    document.getElementById('jitaLink').href = testInfo.log_url;
                }
            } else {
                document.getElementById('pageTitle').textContent = `Timeline - ${runId.slice(0,8)}...`;
                document.getElementById('testMeta').textContent = `${data.phases?.length || 0} phases • ${data.total_logs || 0} log events`;
            }

            const container = document.getElementById('phasesView');
            const phases = data.phases || [];

            if (phases.length === 0) {
                container.innerHTML = '<div class="empty-logs">No timeline data available</div>';
                container.style.display = 'block';
                return;
            }

            container.innerHTML = phases.map((phase, i) => {
                const statusClass = phase.status === 'Failed' ? 'failed' : 
                                   phase.status === 'Running' ? 'running' : 'succeeded';
                const hasErrors = phase.error_count > 0;
                const hasWarnings = phase.warn_count > 0;
                const logs = phase.logs || [];

                return `
                    <div class="phase ${statusClass} ${hasErrors ? 'has-errors' : ''} ${hasWarnings ? 'has-warnings' : ''}" id="phase-${i}">
                        <div class="phase-marker">${i + 1}</div>
                        <div class="phase-content">
                            <div class="phase-header" onclick="togglePhase(${i})">
                                <div class="phase-title">
                                    <span class="phase-name">${phase.phase_name}</span>
                                    <span class="phase-duration">${formatDuration(phase.duration_seconds)}</span>
                                </div>
                                <div class="phase-stats">
                                    ${phase.error_count > 0 ? `<span class="stat errors">${phase.error_count} errors</span>` : ''}
                                    ${phase.warn_count > 0 ? `<span class="stat warnings">${phase.warn_count} warnings</span>` : ''}
                                    <span class="stat logs">${logs.length} logs</span>
                                    <svg class="phase-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="6 9 12 15 18 9"/>
                                    </svg>
                                </div>
                            </div>
                            <div class="phase-body">
                                ${logs.length > 0 ? logs.map((log, j) => renderLog(log, i, j)).join('') : 
                                    '<div class="empty-logs">No log events in this phase</div>'}
                                ${phase.log_url ? `
                                    <a href="${resolveLogUrl(phase.log_url)}" target="_blank" class="view-log-link">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                                            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                                        </svg>
                                        View raw log file
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.style.display = 'block';

            // Auto-expand phase with errors
            const errorPhaseIdx = phases.findIndex(p => p.error_count > 0);
            if (errorPhaseIdx >= 0) {
                togglePhase(errorPhaseIdx);
            }
        }

        function displayOperations(data) {
            const container = document.getElementById('operationsView');
            const operations = data.operations || [];

            if (operations.length === 0) {
                container.innerHTML = '<div class="empty-logs">No operations data available</div>';
                return;
            }

            // Summary section
            let html = `
                <div class="ops-summary">
                    <div class="summary-stat">
                        <div class="value">${data.operation_count}</div>
                        <div class="label">Operations</div>
                    </div>
                    <div class="summary-stat errors">
                        <div class="value">${data.total_errors}</div>
                        <div class="label">Errors</div>
                    </div>
                    <div class="summary-stat warnings">
                        <div class="value">${data.total_warnings}</div>
                        <div class="label">Warnings</div>
                    </div>
                    <div class="summary-stat failed">
                        <div class="value">${data.failed_operations}</div>
                        <div class="label">Failed Ops</div>
                    </div>
                </div>
                <div class="ops-list">
            `;

            operations.forEach((op, i) => {
                const hasFailure = op.has_task_failure || op.fatal_count > 0;
                const hasWarnings = op.warn_count > 0 && !hasFailure;
                const totalIssues = op.error_count + op.warn_count + op.fatal_count;

                html += `
                    <div class="op-card ${hasFailure ? 'has-failure' : ''} ${hasWarnings ? 'has-warnings' : ''}" id="op-${i}">
                        <div class="op-header" onclick="toggleOp(${i})">
                            <div class="op-title">
                                <div class="op-number">${op.order}</div>
                                <span class="op-name">${escapeHtml(op.display_name)}</span>
                                <span class="op-id">${escapeHtml(op.name)}</span>
                            </div>
                            <div class="op-stats">
                                ${op.fatal_count > 0 ? `<span class="op-stat fatal">${op.fatal_count} fatal</span>` : ''}
                                ${op.error_count > 0 ? `<span class="op-stat errors">${op.error_count} errors</span>` : ''}
                                ${op.warn_count > 0 ? `<span class="op-stat warnings">${op.warn_count} warnings</span>` : ''}
                                ${totalIssues === 0 ? `<span class="op-stat" style="color: var(--success);">✓ OK</span>` : ''}
                                <svg class="op-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </div>
                        </div>
                        <div class="op-body">
                            <div class="op-error-list">
                                ${op.fatal.length > 0 ? `
                                    <div style="font-size: 11px; color: var(--error); font-weight: 600; margin-bottom: 6px;">FATAL ERRORS</div>
                                    ${op.fatal.map(e => renderOpError(e, 'fatal')).join('')}
                                ` : ''}
                                ${op.errors.length > 0 ? `
                                    <div style="font-size: 11px; color: var(--error); font-weight: 600; margin-bottom: 6px; margin-top: 12px;">ERRORS</div>
                                    ${op.errors.map(e => renderOpError(e, 'error')).join('')}
                                ` : ''}
                                ${op.warnings.length > 0 ? `
                                    <div style="font-size: 11px; color: var(--warning); font-weight: 600; margin-bottom: 6px; margin-top: 12px;">WARNINGS</div>
                                    ${op.warnings.map(e => renderOpError(e, 'warn')).join('')}
                                ` : ''}
                                ${totalIssues === 0 ? `
                                    <div style="color: var(--text-muted); font-size: 13px;">This operation completed without errors.</div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;

            // Auto-expand first failed operation
            const failedIdx = operations.findIndex(op => op.has_task_failure || op.fatal_count > 0);
            if (failedIdx >= 0) {
                toggleOp(failedIdx);
            }
        }

        function renderOpError(err, severity) {
            return `
                <div class="op-error ${severity}">
                    <div class="op-error-type">${err.event_type || 'Error'} ${err.priority ? `<span style="opacity: 0.6;">(${err.priority})</span>` : ''}</div>
                    <div class="op-error-msg">${escapeHtml(truncate(err.message, 300))}</div>
                </div>
            `;
        }

        function toggleOp(i) {
            document.getElementById(`op-${i}`).classList.toggle('expanded');
        }

        function renderLog(log, phaseIdx, logIdx) {
            const sevClass = (log.severity || 'info').toLowerCase();
            const hasStack = log.stack_trace && log.stack_trace.length > 10;
            const priority = log.priority || 'P3';
            const priorityClass = priority.toLowerCase();

            return `
                <div class="log-entry ${sevClass}" id="log-${phaseIdx}-${logIdx}">
                    <div class="log-header" onclick="toggleLog(${phaseIdx}, ${logIdx})">
                        <span class="priority-badge ${priorityClass}">${priority}</span>
                        <span class="log-severity ${sevClass}">${log.severity || 'INFO'}</span>
                        <div class="log-info">
                            <div class="log-message">${escapeHtml(truncate(log.message, 200))}</div>
                            <div class="log-meta">
                                <span>${log.event_type || 'General'}</span>
                                <span>${log.log_source}</span>
                                ${log.timestamp ? `<span>${formatTime(log.timestamp)}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    ${hasStack ? `
                        <div class="log-details">
                            <div class="stack-trace">${formatStack(log.stack_trace)}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function togglePhase(i) {
            document.getElementById(`phase-${i}`).classList.toggle('expanded');
        }

        function toggleLog(p, l) {
            document.getElementById(`log-${p}-${l}`).classList.toggle('expanded');
        }

        function resolveLogUrl(url) {
            // JITA API URLs need to be accessed directly
            return url;
        }

        function formatDuration(s) {
            if (!s) return '-';
            if (s < 60) return s + 's';
            if (s < 3600) return Math.floor(s/60) + 'm ' + (s%60) + 's';
            return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm';
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts * 1000);
            return d.toLocaleTimeString();
        }

        function formatStack(text) {
            if (!text) return '';
            return escapeHtml(text).split('\n').map(line => {
                if (/Error|Exception|raise|assert|Failed/i.test(line)) {
                    return `<span class="hl">${line}</span>`;
                }
                return line;
            }).join('\n');
        }

        function truncate(s, len) {
            if (!s) return '';
            return s.length > len ? s.slice(0, len) + '...' : s;
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
