<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA - Nutanix Objects Virtual Assistant</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="AI-powered assistant for managing Nutanix Objects storage">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NOVA">
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        [data-theme="light"] .sidebar {
            background: rgba(255, 255, 255, 0.92);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-glow);
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-subtitle {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: var(--font-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-bottom: 24px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .chat-history-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-history-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .chat-history-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .chat-history-item.active {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .chat-history-item-icon {
            width: 32px;
            height: 32px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-history-item-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
        }

        .chat-history-item-info {
            flex: 1;
            min-width: 0;
        }

        .chat-history-item-title {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-history-item-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .chat-history-item-delete {
            opacity: 0;
            padding: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
            transition: all var(--transition-fast);
        }

        .chat-history-item:hover .chat-history-item-delete {
            opacity: 1;
        }

        .chat-history-item-delete:hover {
            color: var(--error);
            background: var(--error-bg);
        }

        .chat-history-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .nav-section {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        
        .nav-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all var(--transition-normal);
            margin-bottom: 4px;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .nav-item.active {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        /* View containers */
        .view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .view-container iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: var(--bg-primary);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(18, 18, 26, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        [data-theme="light"] .header {
            background: rgba(255, 255, 255, 0.85);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--warning);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-indicator.online {
            background: var(--success);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
        }

        .theme-toggle {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all var(--transition-fast);
        }

        .theme-btn:hover {
            color: var(--text-primary);
        }

        .theme-btn.active {
            background: var(--accent-gradient);
            color: white;
        }

        .theme-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 32px;
            padding-bottom: 160px; /* Space for fixed input */
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        /* Welcome Screen */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .welcome-icon {
            width: 120px;
            height: 120px;
            background: var(--accent-gradient);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            box-shadow: 0 8px 60px var(--accent-glow);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .welcome-icon svg {
            width: 60px;
            height: 60px;
            fill: white;
        }

        .welcome-title {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 48px;
            max-width: 550px;
            line-height: 1.7;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 600px;
        }

        .suggestion-btn {
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: var(--font-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .suggestion-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent-primary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 16px;
            max-width: 850px;
            animation: messageSlide 0.4s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
            margin-left: auto;
        }

        .message-avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: var(--accent-gradient);
            box-shadow: var(--shadow-glow);
        }

        .message.user .message-avatar {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
        }

        .message-avatar svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .message.user .message-avatar svg {
            fill: var(--text-secondary);
        }

        .message-content {
            padding: 16px 20px;
            border-radius: 16px;
            max-width: min(700px, calc(100vw - 160px));
            overflow: hidden;
        }

        .message.assistant .message-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
        }

        .message.user .message-content {
            background: var(--accent-gradient);
            border-top-right-radius: 4px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.6;
            overflow-x: visible;
            overflow-y: visible;
        }
        
        /* Section headers within messages */
        .message-text strong:first-child {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        /* Scrollable container for wide content */
        .message-text .table-wrapper {
            overflow-x: auto;
            overflow-y: hidden;
            margin: 16px 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-primary) transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        
        .message-text .table-wrapper + .table-wrapper {
            margin-top: 20px;
        }
        
        .message-text .table-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        
        .message-text .table-wrapper::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 0 0 8px 8px;
        }
        
        .message-text .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }

        .message.assistant .message-text {
            color: var(--text-primary);
        }

        .message.user .message-text {
            color: white;
        }

        .message-text p { margin: 0 0 12px 0; }
        .message-text p:last-child { margin-bottom: 0; }
        .message-text strong { font-weight: 600; }
        .message-text code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 13px;
        }
        .message-text pre {
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .message-text pre code {
            background: none;
            padding: 0;
        }
        .message-text pre {
            overflow-x: auto;
            max-width: 100%;
        }
        .message-text ul, .message-text ol {
            margin: 12px 0;
            padding-left: 24px;
        }
        .message-text li { margin-bottom: 6px; }
        
        /* Chat images (charts, graphs) */
        .chat-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 12px 0;
            background: var(--bg-tertiary);
            display: block;
        }
        .chat-image.chart-error {
            min-height: 150px;
            opacity: 0.7;
        }
        
        /* Chart containers */
        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            max-width: 600px;
        }
        .chart-container canvas {
            max-height: 300px;
        }
        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            text-align: center;
        }
        .message-text a {
            color: var(--accent-primary);
            text-decoration: none;
        }
        .message-text a:hover {
            text-decoration: underline;
        }
        
        /* Message formatting styles */
        .msg-h1 {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text-primary);
            margin: 16px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent-primary);
        }
        .msg-h2 {
            font-size: 1.3em;
            font-weight: 600;
            color: var(--text-primary);
            margin: 14px 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .msg-h3 {
            font-size: 1.15em;
            font-weight: 600;
            color: var(--accent-primary);
            margin: 12px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .msg-h3::before {
            content: '▸';
            color: var(--accent-secondary);
        }
        .msg-h4 {
            font-size: 1em;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 10px 0 6px 0;
        }
        .msg-hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border-color), transparent);
            margin: 16px 0;
        }
        .msg-li {
            display: block;
            padding: 4px 0 4px 20px;
            position: relative;
        }
        .msg-li::before {
            content: '•';
            color: var(--accent-primary);
            font-weight: bold;
            position: absolute;
            left: 4px;
        }
        .msg-li-num {
            display: block;
            padding: 4px 0 4px 24px;
            position: relative;
            counter-increment: list-counter;
        }
        .msg-li-num::before {
            content: counter(list-counter) ".";
            color: var(--accent-primary);
            font-weight: 600;
            position: absolute;
            left: 0;
        }
        .message-text { counter-reset: list-counter; }
        .msg-code {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.9em;
            color: var(--accent-secondary);
        }
        .msg-pre {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
            overflow-x: auto;
        }
        .msg-pre code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            color: var(--text-secondary);
            background: none;
            padding: 0;
        }
        .msg-quote {
            border-left: 3px solid var(--accent-primary);
            padding-left: 12px;
            margin: 10px 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        
        /* Status badges in messages */
        .status-ok { color: #10b981; font-weight: 600; }
        .status-warn { color: #f59e0b; font-weight: 600; }
        .status-error { color: #ef4444; font-weight: 600; }
        .status-info { color: #6366f1; font-weight: 600; }
        
        /* Section divider */
        .section-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border-color) 20%, var(--border-color) 80%, transparent);
            margin: 20px 0;
        }
        
        /* Summary box */
        .msg-summary {
            background: var(--bg-tertiary);
            border-left: 4px solid var(--accent-primary);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin: 12px 0;
        }
        
        /* Highlight box for important info */
        .msg-highlight {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 12px 16px;
            border-radius: 8px;
            margin: 12px 0;
        }
        
        /* Key-value pairs styling */
        .msg-kv {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
        }
        .msg-kv:last-child { border-bottom: none; }
        .msg-key { color: var(--text-muted); }
        .msg-value { color: var(--text-primary); font-weight: 500; }
        
        /* Status icons */
        .status-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            margin-right: 4px;
        }
        .status-icon.ok {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        .status-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .status-icon.warn {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        .status-icon.info {
            background: rgba(99, 102, 241, 0.2);
            color: #6366f1;
        }
        
        /* Highlighted numbers */
        .highlight-num {
            font-weight: 600;
            color: var(--accent-primary);
        }
        .highlight-unit {
            font-size: 0.85em;
            color: var(--text-muted);
            text-transform: lowercase;
        }

        /* Data Tables */
        .data-table {
            width: auto;
            border-collapse: collapse;
            margin: 0;
            font-size: 13px;
            background: var(--bg-primary);
            table-layout: auto;
        }
        .data-table th {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            white-space: nowrap;
        }
        .data-table th:last-child {
            border-right: none;
        }
        .data-table td {
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 12px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .data-table td:last-child {
            border-right: none;
        }
        .data-table tr:last-child td {
            border-bottom: none;
        }
        .data-table tr:nth-child(even) td {
            background: rgba(0,0,0,0.02);
        }
        [data-theme="dark"] .data-table tr:nth-child(even) td {
            background: rgba(255,255,255,0.02);
        }
        .data-table tr:hover td {
            background: var(--bg-hover);
        }
        .data-table .num {
            text-align: right;
            font-family: var(--font-mono);
            white-space: nowrap;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area - Fixed at bottom */
        .input-area {
            position: fixed;
            bottom: 0;
            left: var(--sidebar-width);
            right: 0;
            padding: 16px 32px 24px;
            background: linear-gradient(to top, var(--bg-primary) 70%, rgba(18, 18, 26, 0.95) 85%, transparent);
            z-index: 200;
            backdrop-filter: blur(10px);
        }
        
        [data-theme="light"] .input-area {
            background: linear-gradient(to top, var(--bg-primary) 70%, rgba(255, 255, 255, 0.95) 85%, transparent);
        }

        .input-container {
            display: flex;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            transition: all var(--transition-normal);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .input-wrapper.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .message-input {
            width: 100%;
            padding: 16px 20px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-primary);
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 150px;
            min-height: 52px;
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }
        
        .message-input:disabled {
            cursor: not-allowed;
        }

        .send-btn {
            width: 52px;
            height: 52px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-normal);
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .send-btn.loading {
            animation: pulse-btn 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse-btn {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .send-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .input-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .input-hint kbd {
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 10px;
        }

        /* Mobile */
        .mobile-menu-btn {
            display: none;
            padding: 8px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform var(--transition-normal);
                z-index: 1000;
            }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-menu-btn { display: flex; }
            .chat-area { 
                padding: 20px; 
                padding-bottom: 140px;
            }
            .input-area { 
                left: 0;
                padding: 12px 16px 20px; 
            }
            .message-content {
                max-width: calc(100vw - 100px);
            }
            .welcome-title { font-size: 28px; }
            .welcome-subtitle { font-size: 15px; }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .sidebar-overlay.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">

            <div class="chat-history-section">

            <div class="nav-section">

                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Settings</span>

            </div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span id="statusText" style="color: var(--text-secondary); font-size: 14px;">Connecting...</span>
                </div>
                <div class="theme-toggle">
                    <button class="theme-btn active" data-theme="dark" title="Dark" onclick="setTheme('dark')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

                    </button>
                    <button class="theme-btn" data-theme="light" title="Light" onclick="setTheme('light')">

                    <button class="theme-btn" data-theme="nutanix" title="Nutanix" onclick="setTheme('nutanix')">

                            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
                        </svg>

            <!-- Chat View -->
            <div class="view-container" id="chatView" style="display: flex; flex-direction: column; flex: 1;">
                <div class="chat-area" id="chatArea">
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <h1 class="welcome-title">Hello, I'm NOVA</h1>
                        <p class="welcome-subtitle">Your intelligent assistant for Nutanix Objects. I can help you manage buckets, analyze storage trends, and much more.</p>
                        <div class="suggestions">
                            <button class="suggestion-btn" onclick="sendSuggestion('List all buckets')">List all buckets</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Create a new bucket')">Create a bucket</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Show storage statistics')">Storage stats</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Help')">Help</button>
                        </div>

                        <div class="input-wrapper">
                            <textarea class="message-input" id="messageInput" placeholder="Ask NOVA anything..." rows="1"></textarea>
                        </div>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift + Enter</kbd> for new line</div>
                </div>
            </div>
            
            <!-- Database View -->
            <div class="view-container" id="databaseView" style="display: none; flex: 1;">
                <iframe src="db-browser.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
            
            <!-- Logs View -->
            <div class="view-container" id="logsView" style="display: none; flex: 1;">
                <iframe src="log-browser.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
            
            <!-- JITA View -->
            <div class="view-container" id="jitaView" style="display: none; flex: 1;">
                <iframe src="jita-browser.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
            
            <!-- Settings View -->
            <div class="view-container" id="settingsView" style="display: none; flex: 1;">
                <iframe src="settings.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>

    </div>

    <script>
        // Configuration - Auto-detect backend URL based on current hostname
        const API_BASE = localStorage.getItem('nova-backend-url') || `http://${window.location.hostname}:9360`;
        let currentSessionId = `session-${Date.now()}`;
        let chatSessions = JSON.parse(localStorage.getItem('nova-chat-sessions') || '{}');
        let isProcessing = false; // Track message processing state
        let currentView = 'chat';

        // Handle URL query params for deep linking (PWA shortcuts)
        (function handleDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const view = params.get('view');
            if (view && ['chat', 'database', 'logs', 'settings'].includes(view)) {
                currentView = view;
                // Apply view after DOM loads
                document.addEventListener('DOMContentLoaded', () => switchView(view));
            }
        })();

        // View Switching
        function switchView(viewName) {
            currentView = viewName;
            
            // Hide all views
            document.querySelectorAll('.view-container').forEach(v => v.style.display = 'none');
            
            // Show selected view
            const viewMap = {
                'chat': 'chatView',
                'database': 'databaseView',
                'logs': 'logsView',
                'jita': 'jitaView',
                'settings': 'settingsView'
            };
            const viewEl = document.getElementById(viewMap[viewName]);
            if (viewEl) {
                viewEl.style.display = viewName === 'chat' ? 'flex' : 'block';
            }
            
            // Update nav active state
            document.querySelectorAll('.nav-item[data-view]').forEach(item => {
                item.classList.toggle('active', item.dataset.view === viewName);
            });
            
            // Update page title
            const titles = {
                'chat': 'Chat',
                'database': 'Database Browser',
                'logs': 'Log Browser',
                'jita': 'JITA Browser',
                'settings': 'Settings'
            };
            document.title = `NOVA - ${titles[viewName] || 'Nutanix Objects Virtual Assistant'}`;
            
            // Update URL for bookmarking/history (without reload)
            const url = new URL(window.location);
            if (viewName === 'chat') {
                url.searchParams.delete('view');
            } else {
                url.searchParams.set('view', viewName);
            }
            window.history.replaceState({view: viewName}, '', url);
            
            // Close mobile sidebar (explicit close, not toggle)
            document.getElementById('sidebar')?.classList.remove('open');
            document.getElementById('sidebarOverlay')?.classList.remove('visible');
        }

        // Theme
        const savedTheme = localStorage.getItem('nova-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === savedTheme);
        });

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('nova-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        // Sidebar toggle (mobile)
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('visible');
        }

        // Check backend status
        async function checkStatus() {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                if (response.ok) {
                    const data = await response.json();
                    indicator.classList.add('online');
                    text.textContent = 'NOVA is ready';
                    return true;
                }
            } catch (e) {
                console.log('Backend not available');
            }
            
            indicator.classList.remove('online');
            text.textContent = 'Backend offline';
            return false;
        }

        // Chat history management
        function startNewChat() {
            saveCurrentSession();
            currentSessionId = `session-${Date.now()}`;
            
            // Recreate welcome screen HTML directly
            document.getElementById('chatArea').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen" style="display: flex;">
                    <div class="welcome-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h1 class="welcome-title">Hello, I'm NOVA</h1>
                    <p class="welcome-subtitle">Your intelligent assistant for Nutanix Objects. I can help you manage buckets, analyze storage trends, and much more.</p>
                    <div class="suggestions">
                        <button class="suggestion-btn" onclick="sendSuggestion('List all buckets')">List all buckets</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Create a new bucket')">Create a bucket</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Show storage statistics')">Storage stats</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Help')">Help</button>
                    </div>
                </div>
            `;
            
            loadChatHistory();
            
            // Switch to chat view if not already there
            if (currentView !== 'chat') {
                switchView('chat');
            } else if (window.innerWidth <= 768) {
                toggleSidebar();
            }
        }

        function saveCurrentSession() {
            const chatArea = document.getElementById('chatArea');
            const messages = chatArea.querySelectorAll('.message');
            
            if (messages.length > 0) {
                const firstUserMsg = chatArea.querySelector('.message.user .message-text');
                const title = firstUserMsg ? firstUserMsg.textContent.substring(0, 40) : 'New conversation';
                
                chatSessions[currentSessionId] = {
                    title: title,
                    timestamp: Date.now(),
                    messages: Array.from(messages).map(msg => ({
                        role: msg.classList.contains('user') ? 'user' : 'assistant',
                        content: msg.querySelector('.message-text').innerHTML
                    }))
                };
                
                localStorage.setItem('nova-chat-sessions', JSON.stringify(chatSessions));
            }
        }

        function loadChatHistory() {
            const list = document.getElementById('chatHistoryList');
            const sessions = Object.entries(chatSessions).sort((a, b) => b[1].timestamp - a[1].timestamp);
            
            if (sessions.length === 0) {
                list.innerHTML = '<div class="chat-history-empty">No conversations yet</div>';
                return;
            }
            
            list.innerHTML = sessions.slice(0, 10).map(([id, session]) => `
                <div class="chat-history-item ${id === currentSessionId ? 'active' : ''}" onclick="switchToSession('${id}')">
                    <div class="chat-history-item-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </div>
                    <div class="chat-history-item-info">
                        <div class="chat-history-item-title">${escapeHtml(session.title)}</div>
                        <div class="chat-history-item-time">${getTimeAgo(session.timestamp)}</div>
                    </div>
                    <button class="chat-history-item-delete" onclick="event.stopPropagation(); deleteSession('${id}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function getTimeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

        function switchToSession(sessionId) {
            if (isProcessing) return; // Don't switch while processing
            
            saveCurrentSession();
            currentSessionId = sessionId;
            
            const session = chatSessions[sessionId];
            const chatArea = document.getElementById('chatArea');
            
            // Clear chat area completely
            chatArea.innerHTML = '';
            
            if (session && session.messages && session.messages.length > 0) {
                session.messages.forEach(msg => {
                    addMessage(msg.content, msg.role === 'user', true);
                });
                // Force scroll to bottom after loading
                scrollToBottom(true);
            }
            
            loadChatHistory();
            
            // Switch to chat view if not already there
            if (currentView !== 'chat') {
                switchView('chat');
            } else {
                // Close sidebar on mobile
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('visible');
            }
        }

        function deleteSession(sessionId) {
            if (!confirm('Delete this conversation?')) return;
            
            delete chatSessions[sessionId];
            localStorage.setItem('nova-chat-sessions', JSON.stringify(chatSessions));
            
            if (sessionId === currentSessionId) {
                currentSessionId = `session-${Date.now()}`;
                const chatArea = document.getElementById('chatArea');
                chatArea.innerHTML = `
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <h1 class="welcome-title">Hello, I'm NOVA</h1>
                        <p class="welcome-subtitle">Your intelligent assistant for Nutanix Objects. I can help you manage buckets, analyze storage trends, and much more.</p>
                        <div class="suggestions">
                            <button class="suggestion-btn" onclick="sendSuggestion('List all buckets')">List all buckets</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Create a new bucket')">Create a bucket</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Show storage statistics')">Storage stats</button>
                            <button class="suggestion-btn" onclick="sendSuggestion('Help')">Help</button>
                        </div>
                    </div>
                `;
            }
            loadChatHistory();
        }

        // Message handling
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Detect and convert tabular data to HTML table with scroll wrapper
        function detectAndFormatTable(text) {
            // Check for pipe-separated tables (markdown style)
            if (text.includes('|') && text.split('\n').filter(l => l.includes('|')).length >= 2) {
                const lines = text.split('\n');
                let tableLines = [];
                let beforeTable = [];
                let afterTable = [];
                let inTable = false;
                
                for (const line of lines) {
                    if (line.includes('|') && line.trim().split('|').length >= 2) {
                        inTable = true;
                        // Skip separator lines like |---|---|
                        if (!/^\s*\|?\s*[-:]+\s*\|/.test(line)) {
                            tableLines.push(line);
                        }
                    } else if (inTable && tableLines.length > 0) {
                        afterTable.push(line);
                    } else {
                        beforeTable.push(line);
                    }
                }
                
                if (tableLines.length >= 2) {
                    let html = beforeTable.join('\n');
                    // Wrap table in scrollable container
                    html += '\n<div class="table-wrapper"><table class="data-table"><thead><tr>';
                    
                    // Header row
                    const headers = tableLines[0].split('|').map(h => h.trim()).filter(h => h);
                    headers.forEach(h => { html += `<th>${escapeHtml(h)}</th>`; });
                    html += '</tr></thead><tbody>';
                    
                    // Data rows
                    for (let i = 1; i < tableLines.length; i++) {
                        const cells = tableLines[i].split('|').map(c => c.trim()).filter(c => c);
                        html += '<tr>';
                        cells.forEach((c, idx) => {
                            const isNum = /^[\d,.\-+%$]+$/.test(c.replace(/[,\s]/g, ''));
                            html += `<td${isNum ? ' class="num"' : ''}>${escapeHtml(c)}</td>`;
                        });
                        html += '</tr>';
                    }
                    html += '</tbody></table></div>';
                    html += afterTable.join('\n');
                    return html;
                }
            }
            
            // Check for numbered list that looks like a table (e.g., "1. bucket-name")
            const numberedListMatch = text.match(/^\d+\.\s+\S+/gm);
            if (numberedListMatch && numberedListMatch.length >= 5) {
                // It's a long numbered list - keep as list but format nicely
                return text;
            }
            
            return null;
        }
        
        // Chart rendering functions
        let chartCounter = 0;
        
        function renderChart(chartData) {
            const chartId = `chart-${++chartCounter}`;
            const container = document.createElement('div');
            container.className = 'chart-container';
            container.innerHTML = `
                ${chartData.title ? `<div class="chart-title">${chartData.title}</div>` : ''}
                <canvas id="${chartId}"></canvas>
            `;
            
            // Defer chart creation until canvas is in DOM
            setTimeout(() => {
                const canvas = document.getElementById(chartId);
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
                
                const chartConfig = {
                    type: chartData.type || 'bar',
                    data: {
                        labels: chartData.labels || [],
                        datasets: (chartData.datasets || []).map((ds, i) => ({
                            label: ds.label || `Dataset ${i + 1}`,
                            data: ds.data || [],
                            backgroundColor: ds.backgroundColor || getChartColors(i, 0.7),
                            borderColor: ds.borderColor || getChartColors(i, 1),
                            borderWidth: ds.borderWidth || 2,
                            fill: ds.fill !== undefined ? ds.fill : false,
                            tension: ds.tension || 0.3
                        }))
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                display: chartData.datasets && chartData.datasets.length > 1,
                                labels: { color: isDark ? '#e5e5e5' : '#333' }
                            }
                        },
                        scales: chartData.type !== 'pie' && chartData.type !== 'doughnut' ? {
                            x: {
                                ticks: { color: isDark ? '#a3a3a3' : '#666' },
                                grid: { color: isDark ? '#333' : '#ddd' }
                            },
                            y: {
                                ticks: { color: isDark ? '#a3a3a3' : '#666' },
                                grid: { color: isDark ? '#333' : '#ddd' },
                                beginAtZero: true
                            }
                        } : undefined
                    }
                };
                
                new Chart(ctx, chartConfig);
            }, 100);
            
            return container.outerHTML;
        }
        
        function getChartColors(index, alpha = 1) {
            const colors = [
                `rgba(99, 102, 241, ${alpha})`,   // Indigo
                `rgba(16, 185, 129, ${alpha})`,   // Green
                `rgba(245, 158, 11, ${alpha})`,   // Amber
                `rgba(239, 68, 68, ${alpha})`,    // Red
                `rgba(139, 92, 246, ${alpha})`,   // Purple
                `rgba(6, 182, 212, ${alpha})`,    // Cyan
                `rgba(236, 72, 153, ${alpha})`,   // Pink
                `rgba(34, 197, 94, ${alpha})`     // Emerald
            ];
            return colors[index % colors.length];
        }
        
        function detectAndRenderChart(text) {
            // Look for chart JSON blocks with multiple patterns
            // Pattern 1: ```chart\n{...}\n```
            // Pattern 2: ```chart{...}```
            // Pattern 3: Handle with or without newlines
            
            let result = text;
            
            // Try multiple regex patterns to catch different formats
            const patterns = [
                /```chart\s*\n?\s*(\{[\s\S]*?\})\s*\n?```/g,
                /```chart\s*(\{[\s\S]*?\})\s*```/g,
                /`{3}chart\s*([\s\S]*?)`{3}/g
            ];
            
            for (const chartRegex of patterns) {
                let match;
                while ((match = chartRegex.exec(result)) !== null) {
                    try {
                        // Clean up the JSON string
                        let jsonStr = match[1].trim();
                        // Handle potential issues with the JSON
                        const chartData = JSON.parse(jsonStr);
                        const chartHtml = renderChart(chartData);
                        result = result.replace(match[0], chartHtml);
                        // Reset regex lastIndex since we modified the string
                        chartRegex.lastIndex = 0;
                    } catch (e) {
                        console.error('Failed to parse chart data:', e, match[1]);
                    }
                }
            }
            
            // Also try to find chart JSON without backticks (in case markdown didn't wrap it)
            const rawJsonPattern = /\{"type"\s*:\s*"(bar|line|pie|doughnut)"[\s\S]*?"datasets"\s*:\s*\[[\s\S]*?\]\s*\}/g;
            let jsonMatch;
            while ((jsonMatch = rawJsonPattern.exec(result)) !== null) {
                try {
                    const chartData = JSON.parse(jsonMatch[0]);
                    if (chartData.type && chartData.datasets) {
                        const chartHtml = renderChart(chartData);
                        result = result.replace(jsonMatch[0], chartHtml);
                        rawJsonPattern.lastIndex = 0;
                    }
                } catch (e) {
                    // Not valid chart JSON, skip
                }
            }
            
            return result;
        }

        function formatMessage(text) {
            // First, detect and render any charts - this is critical to run before anything else
            text = detectAndRenderChart(text);
            
            // If there are still unprocessed chart blocks (fallback), remove them to avoid showing raw JSON
            // This handles edge cases where the JSON is malformed
            text = text.replace(/```chart[\s\S]*?```/g, function(match) {
                console.warn('Unprocessed chart block found:', match.substring(0, 100));
                // Try one more time to parse it
                try {
                    const jsonMatch = match.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const chartData = JSON.parse(jsonMatch[0]);
                        if (chartData.type && chartData.datasets) {
                            return renderChart(chartData);
                        }
                    }
                } catch(e) {
                    console.error('Chart parse error:', e);
                }
                // Return a placeholder if we can't render it
                return '<div class="chart-container" style="background: #1a1a2e; padding: 20px; border-radius: 8px; text-align: center; color: #888;">📊 Chart data could not be rendered</div>';
            });
            
            // Split by double newlines to handle multiple sections/tables
            // But preserve chart containers as single units
            const chartPlaceholder = '___CHART_PLACEHOLDER___';
            const charts = [];
            // Match chart containers - they have chart-container class and end with </div>
            text = text.replace(/<div class="chart-container"[^>]*>[\s\S]*?<\/div>/g, function(match) {
                charts.push(match);
                return chartPlaceholder + (charts.length - 1);
            });
            
            const sections = text.split(/\n\n+/);
            let formattedSections = [];
            
            for (const section of sections) {
                if (!section.trim()) continue;
                
                // Check if this section has a chart placeholder
                if (section.includes(chartPlaceholder)) {
                    // Restore charts and add the section
                    let restored = section;
                    for (let i = 0; i < charts.length; i++) {
                        restored = restored.replace(chartPlaceholder + i, charts[i]);
                    }
                    formattedSections.push(applyTextFormatting(restored));
                } else {
                    // Try to detect and format tables
                    const tableFormatted = detectAndFormatTable(section);
                    if (tableFormatted) {
                        formattedSections.push(applyTextFormatting(tableFormatted));
                    } else {
                        formattedSections.push(applyTextFormatting(section));
                    }
                }
            }
            
            // Join sections with proper spacing
            return formattedSections.join('<div class="section-divider"></div>');
        }
        
        function applyTextFormatting(text) {
            // Skip if it contains chart container (already rendered)
            if (text.includes('chart-container')) {
                return text;
            }
            
            return text
                // Markdown images: ![alt](url)
                .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="chat-image" onerror="this.onerror=null;this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22><rect fill=%22%23333%22 width=%22100%%22 height=%22100%%22/><text fill=%22%23888%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22>Chart failed to load</text></svg>\';this.classList.add(\'chart-error\');">')
                // Markdown links: [text](url)
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
                // Headers (process before other formatting)
                .replace(/^####\s+(.+)$/gm, '<h4 class="msg-h4">$1</h4>')
                .replace(/^###\s+(.+)$/gm, '<h3 class="msg-h3">$1</h3>')
                .replace(/^##\s+(.+)$/gm, '<h2 class="msg-h2">$1</h2>')
                .replace(/^#\s+(.+)$/gm, '<h1 class="msg-h1">$1</h1>')
                // Horizontal rule
                .replace(/^---+$/gm, '<hr class="msg-hr">')
                // Bullet lists
                .replace(/^[-*]\s+(.+)$/gm, '<li class="msg-li">$1</li>')
                // Numbered lists
                .replace(/^\d+\.\s+(.+)$/gm, '<li class="msg-li-num">$1</li>')
                // Bold
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                // Inline code (single backticks, not triple)
                .replace(/`([^`\n]+)`/g, '<code class="msg-code">$1</code>')
                // Code blocks - but NOT chart blocks (they should already be processed)
                .replace(/```(?!chart)([\w]*)\n?([\s\S]*?)```/g, '<pre class="msg-pre"><code>$2</code></pre>')
                // Blockquotes
                .replace(/^>\s+(.+)$/gm, '<blockquote class="msg-quote">$1</blockquote>')
                // Wrap consecutive li items in ul/ol
                .replace(/(<li class="msg-li">[\s\S]*?<\/li>)(?:\s*<br>)*/g, '$1')
                .replace(/(<li class="msg-li-num">[\s\S]*?<\/li>)(?:\s*<br>)*/g, '$1')
                // Line breaks (but not after block elements)
                .replace(/\n(?!<\/?(h[1-4]|li|ul|ol|hr|pre|blockquote|div))/g, '<br>')
                // Status indicators
                .replace(/✅|✔️|\[OK\]|\[SUCCESS\]/g, '<span class="status-icon ok">✓</span>')
                .replace(/❌|✖️|\[ERROR\]|\[FAIL\]/g, '<span class="status-icon error">✗</span>')
                .replace(/⚠️|\[WARNING\]|\[WARN\]/g, '<span class="status-icon warn">⚠</span>')
                .replace(/ℹ️|\[INFO\]/g, '<span class="status-icon info">ℹ</span>')
                // Highlight important numbers
                .replace(/\b(\d+(?:,\d{3})*(?:\.\d+)?)\s*(GB|MB|KB|TB|errors?|warnings?|fatals?|alerts?)\b/gi, 
                    '<span class="highlight-num">$1</span> <span class="highlight-unit">$2</span>');
        }

        function scrollToBottom(force = false) {
            const chatArea = document.getElementById('chatArea');
            if (!chatArea) return;
            
            const doScroll = () => {
                // Force immediate scroll using scrollTop
                chatArea.scrollTop = chatArea.scrollHeight + 1000;
            };
            
            // Immediate scroll
            doScroll();
            
            // Multiple delayed attempts to catch DOM updates
            setTimeout(doScroll, 50);
            setTimeout(doScroll, 150);
            setTimeout(doScroll, 300);
            setTimeout(doScroll, 500);
        }

        function addMessage(content, isUser = false, isHtml = false) {
            const chatArea = document.getElementById('chatArea');
            const welcomeScreen = document.getElementById('welcomeScreen');
            if (welcomeScreen) welcomeScreen.style.display = 'none';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            const avatarSvg = isUser 
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>'
                : '<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatarSvg}</div>
                <div class="message-content">
                    <div class="message-text">${isHtml ? content : (isUser ? escapeHtml(content) : formatMessage(content))}</div>
                </div>
            `;
            
            chatArea.appendChild(messageDiv);
            scrollToBottom();
            
            return messageDiv;
        }

        function addTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const typing = document.createElement('div');
            typing.className = 'message assistant';
            typing.id = 'typingIndicator';
            typing.innerHTML = `
                <div class="message-avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatArea.appendChild(typing);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // Set processing state (disable/enable input)
        function setProcessingState(processing) {
            isProcessing = processing;
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const inputWrapper = input.closest('.input-wrapper');
            
            input.disabled = processing;
            sendBtn.disabled = processing;
            inputWrapper.classList.toggle('disabled', processing);
            sendBtn.classList.toggle('loading', processing);
            
            if (processing) {
                input.placeholder = 'NOVA is thinking...';
            } else {
                input.placeholder = 'Ask NOVA anything...';
                input.focus();
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || isProcessing) return;
            
            input.value = '';
            input.style.height = 'auto';
            
            addMessage(message, true);
            addTypingIndicator();
            setProcessingState(true);
            
            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: currentSessionId
                    })
                });
                
                removeTypingIndicator();
                
                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.message || 'No response');
                    
                    // Show suggestions if available
                    if (data.suggestions && data.suggestions.length > 0) {
                        const chatArea = document.getElementById('chatArea');
                        const suggestionsHtml = `
                            <div class="suggestions" style="justify-content: flex-start; padding-left: 60px; margin-top: -12px;">
                                ${data.suggestions.map(s => `<button class="suggestion-btn" onclick="sendSuggestion('${escapeHtml(s)}')">${escapeHtml(s)}</button>`).join('')}
                            </div>
                        `;
                        chatArea.insertAdjacentHTML('beforeend', suggestionsHtml);
                        scrollToBottom();
                    }
                } else {
                    addMessage('Sorry, something went wrong. Please try again.');
                }
            } catch (e) {
                removeTypingIndicator();
                addMessage('Cannot connect to backend. Please check if the server is running.');
            }
            
            setProcessingState(false);
            saveCurrentSession();
            loadChatHistory();
        }

        function sendSuggestion(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        // Input handling
        const messageInput = document.getElementById('messageInput');
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !isProcessing) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            loadChatHistory();
            setInterval(checkStatus, 30000);
            
            // Set up MutationObserver to auto-scroll when content is added
            const chatArea = document.getElementById('chatArea');
            const observer = new MutationObserver((mutations) => {
                // Check if we should auto-scroll (user hasn't scrolled up significantly)
                const isNearBottom = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < 200;
                if (isNearBottom || isProcessing) {
                    scrollToBottom();
                }
            });
            
            observer.observe(chatArea, { 
                childList: true, 
                subtree: true,
                characterData: true
            });
        });
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered:', registration.scope);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New version available
                                    if (confirm('New version available! Reload to update?')) {
                                        newWorker.postMessage('skipWaiting');
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>
</body>
