<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - NOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon svg {
            width: 22px;
            height: 22px;
            stroke: white;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--text-inverse, white);
        }

        .btn-primary:hover { background: var(--accent-secondary); }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover { background: var(--bg-hover); }

        .btn svg {
            width: 14px;
            height: 14px;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .summary-card .value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .summary-card .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-card.running .value { color: var(--accent-primary); }
        .summary-card.pending .value { color: var(--warning); }
        .summary-card.completed .value { color: var(--success); }
        .summary-card.failed .value { color: var(--error); }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.15s;
        }

        .task-card:hover {
            border-color: var(--accent-primary);
        }

        .task-card.running {
            border-left: 3px solid var(--accent-primary);
        }

        .task-card.pending {
            border-left: 3px solid var(--warning);
        }

        .task-card.completed {
            border-left: 3px solid var(--success);
        }

        .task-card.failed {
            border-left: 3px solid var(--error);
        }

        .task-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .task-icon.jita_analysis { background: var(--accent-primary); }
        .task-icon.log_upload { background: var(--info); }
        .task-icon.data_sync { background: var(--warning); }
        .task-icon.other { background: var(--bg-tertiary); }

        .task-icon svg {
            width: 22px;
            height: 22px;
            stroke: white;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .task-desc {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-meta {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .task-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .task-progress {
            width: 200px;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-primary);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .task-card.completed .progress-fill { background: var(--success); }
        .task-card.failed .progress-fill { background: var(--error); }

        .progress-text {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }

        .task-status {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .task-status.running {
            background: var(--bg-hover);
            color: var(--accent-primary);
        }

        .task-status.pending {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .task-status.completed {
            background: var(--success-bg);
            color: var(--success);
        }

        .task-status.failed {
            background: var(--error-bg);
            color: var(--error);
        }

        .task-status.cancelled {
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .task-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .task-action-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .task-action-btn.danger:hover {
            background: var(--error-bg);
            color: var(--error);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--text-muted);
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        /* Spinner */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: var(--shadow-lg);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Auto-refresh indicator */
        .refresh-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .refresh-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                </div>
                Task Manager
            </h1>
            <div class="header-actions">
                <div class="refresh-indicator">
                    <div class="refresh-dot"></div>
                    Auto-refresh: 3s
                </div>
                <button class="btn btn-secondary" onclick="loadTasks()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                    Refresh
                </button>
                <a href="index.html" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back
                </a>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="summary-grid" id="summaryGrid">
            <div class="summary-card running">
                <div class="value" id="runningCount">-</div>
                <div class="label">Running</div>
            </div>
            <div class="summary-card pending">
                <div class="value" id="pendingCount">-</div>
                <div class="label">Pending</div>
            </div>
            <div class="summary-card completed">
                <div class="value" id="completedCount">-</div>
                <div class="label">Completed</div>
            </div>
            <div class="summary-card failed">
                <div class="value" id="failedCount">-</div>
                <div class="label">Failed</div>
            </div>
        </div>

        <!-- Active Tasks -->
        <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
            Active Tasks
        </div>
        <div class="task-list" id="activeTasks">
            <div class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>
                <div class="empty-title">No Active Tasks</div>
                <div>All background tasks have completed</div>
            </div>
        </div>

        <!-- Recent Tasks -->
        <div class="section-title" style="margin-top: 32px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
            Recent Tasks
        </div>
        <div class="task-list" id="recentTasks">
            <!-- Tasks will be rendered here -->
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // Theme initialization
        (function initTheme() {
            const params = new URLSearchParams(window.location.search);
            let theme = params.get('theme');
            if (!theme) {
                try { theme = window.parent?.document?.documentElement?.getAttribute('data-theme'); } catch(e) {}
            }
            if (!theme) {
                theme = localStorage.getItem('nova-theme') || 'dark';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();

        const API = `http://${window.location.hostname}:9360/api/tasks`;
        let refreshInterval = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            // Auto-refresh every 3 seconds
            refreshInterval = setInterval(loadTasks, 3000);
        });

        async function loadTasks() {
            try {
                // Get summary
                const summaryRes = await fetch(`${API}/summary`);
                const summary = await summaryRes.json();

                if (summary.success) {
                    document.getElementById('runningCount').textContent = summary.running || 0;
                    document.getElementById('pendingCount').textContent = summary.pending || 0;
                    document.getElementById('completedCount').textContent = summary.completed || 0;
                    document.getElementById('failedCount').textContent = summary.failed || 0;
                }

                // Get all tasks
                const tasksRes = await fetch(`${API}/?limit=50`);
                const tasksData = await tasksRes.json();

                if (tasksData.success) {
                    renderTasks(tasksData.tasks || []);
                }

            } catch (e) {
                console.error('Failed to load tasks:', e);
            }
        }

        function renderTasks(tasks) {
            const activeTasks = tasks.filter(t => t.status === 'running' || t.status === 'pending');
            const recentTasks = tasks.filter(t => t.status !== 'running' && t.status !== 'pending').slice(0, 20);

            // Render active tasks
            const activeContainer = document.getElementById('activeTasks');
            if (activeTasks.length === 0) {
                activeContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                        </div>
                        <div class="empty-title">No Active Tasks</div>
                        <div>All background tasks have completed</div>
                    </div>
                `;
            } else {
                activeContainer.innerHTML = activeTasks.map(t => renderTaskCard(t)).join('');
            }

            // Render recent tasks
            const recentContainer = document.getElementById('recentTasks');
            if (recentTasks.length === 0) {
                recentContainer.innerHTML = `
                    <div class="empty-state" style="padding: 40px;">
                        <div>No recent tasks</div>
                    </div>
                `;
            } else {
                recentContainer.innerHTML = recentTasks.map(t => renderTaskCard(t)).join('');
            }
        }

        function renderTaskCard(task) {
            const icon = getTaskIcon(task.task_type);
            const duration = task.duration_seconds ? formatDuration(task.duration_seconds) : '-';
            const startTime = task.started_at ? new Date(task.started_at).toLocaleTimeString() : '-';

            return `
                <div class="task-card ${task.status}">
                    <div class="task-icon ${task.task_type}">
                        ${icon}
                    </div>
                    <div class="task-info">
                        <div class="task-name">${escapeHtml(task.name)}</div>
                        <div class="task-desc">${escapeHtml(task.description || task.task_id)}</div>
                        <div class="task-meta">
                            <span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <polyline points="12 6 12 12 16 14"/>
                                </svg>
                                ${startTime}
                            </span>
                            <span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                                </svg>
                                ${duration}
                            </span>
                            ${task.error ? `<span style="color: var(--error);">Error: ${escapeHtml(task.error.slice(0, 50))}...</span>` : ''}
                        </div>
                    </div>
                    <div class="task-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${task.progress || 0}%"></div>
                        </div>
                        <div class="progress-text">${task.progress_message || `${task.progress || 0}%`}</div>
                    </div>
                    <div class="task-status ${task.status}">${task.status}</div>
                    ${task.status === 'running' ? `
                        <div class="task-actions">
                            <button class="task-action-btn danger" onclick="cancelTask('${task.task_id}')" title="Cancel">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="15" y1="9" x2="9" y2="15"/>
                                    <line x1="9" y1="9" x2="15" y2="15"/>
                                </svg>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function getTaskIcon(taskType) {
            const icons = {
                'jita_analysis': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>`,
                'log_upload': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>`,
                'data_sync': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>`,
                'default': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>`
            };
            return icons[taskType] || icons['default'];
        }

        async function cancelTask(taskId) {
            if (!confirm('Are you sure you want to cancel this task?')) return;

            try {
                const res = await fetch(`${API}/${taskId}/cancel`, { method: 'POST' });
                const data = await res.json();

                if (data.success) {
                    showToast('Task cancelled');
                    loadTasks();
                } else {
                    showToast('Failed to cancel: ' + (data.error || 'Unknown error'));
                }
            } catch (e) {
                showToast('Error: ' + e.message);
            }
        }

        function formatDuration(seconds) {
            if (!seconds) return '-';
            if (seconds < 60) return `${Math.round(seconds)}s`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${Math.round(seconds % 60)}s`;
            return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
